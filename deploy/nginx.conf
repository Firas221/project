# nginx reverse proxy with HTTPS. Install as /etc/nginx/conf.d/hotel.conf (http context).
# Certificates from Let's Encrypt: sudo certbot --nginx -d booking.your-hotel.com
limit_req_zone $binary_remote_addr zone=hotel_login:10m rate=10r/m;

server {
    listen 80;
    server_name booking.your-hotel.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name booking.your-hotel.com;
    ssl_certificate     /etc/letsencrypt/live/booking.your-hotel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booking.your-hotel.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;   # room photos are uploaded at up to about 2 MB; everything else is limited to 256 KB by the app

    # extra brute-force protection at the edge
    location = /api/auth/login {
        limit_req zone=hotel_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append, client-supplied values
        proxy_set_header X-Forwarded-Proto https;
    }
}

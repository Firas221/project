name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The application has no dependencies, so there is nothing to install.
      - name: Run the tests
        working-directory: tests
        run: python -m unittest -v

  browser:
    name: Browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the browser tests
        run: npm run test:browser
